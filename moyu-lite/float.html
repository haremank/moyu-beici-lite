<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>moyu-float</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; cursor: default; }
  html, body { background: transparent; overflow: hidden; height: 100%; -webkit-font-smoothing: antialiased; }
  :root {
    --word-color: #7ae6ac;
    --bg-color: rgba(30, 34, 40, 0.88);
    --border-color: rgba(122, 230, 172, 0.3);
    --card-o-idle: 0.15;
    --card-o-hover: 0.95;
    --text-o-idle: 0;
    --text-o-hover: 1;
    --sub-color: #aeb7c2;
  }
  .card {
    position: relative;
    height: 100vh; display: flex; flex-direction: column; justify-content: center;
    background: transparent; border-radius: 10px; padding: 10px 16px;
    font-family: 'Consolas', 'Microsoft YaHei', monospace;
  }
  /* 背景独立图层：背景透明度不再与文字透明度相乘 */
  .card::before {
    content: ''; position: absolute; inset: 0; z-index: 0;
    background: var(--bg-color); border: 1px solid var(--border-color); border-radius: 10px;
    box-shadow: 0 4px 18px rgba(0,0,0,0.35);
    opacity: var(--card-o-idle);
    transition: opacity 0.25s ease;
  }
  body.hovered .card::before { opacity: var(--card-o-hover); }
  .card > .meta, .card > .word, .card > .trans, .card > .bottomrow { position: relative; z-index: 1; }
  /* 文字独立双态：平时（含隐藏态）不显示任何文字，悬停才浮现 */
  .card > .meta, .card > .word, .card > .trans, .card > .bottomrow {
    opacity: var(--text-o-idle);
    transition: opacity 0.25s ease;
  }
  body.hovered .card > .meta, body.hovered .card > .word, body.hovered .card > .trans, body.hovered .card > .bottomrow {
    opacity: var(--text-o-hover);
  }
  .meta { display: flex; justify-content: space-between; align-items: center; font-size: 11px; color: var(--sub-color); margin-bottom: 4px; padding-right: 24px; }
  .meta-r { display: flex; gap: 6px; align-items: center; }
  /* ⚙ 独立于文字透明度：只要悬停就出现，避免文字透明度为 0 时设置面板无法打开 */
  #gear { position: absolute; top: 6px; right: 10px; z-index: 5; cursor: pointer; color: var(--sub-color); font-size: 15px; padding: 0 4px; border-radius: 4px; opacity: 0; transition: opacity 0.25s ease; }
  body.hovered #gear { opacity: 1; }
  #gear:hover { color: var(--word-color); }
  .word { font-size: 32px; font-weight: var(--word-weight, 800); font-family: var(--word-font, Consolas); color: var(--word-color); letter-spacing: 0.5px; line-height: 1.2; white-space: nowrap;
          text-shadow: var(--word-glow, none); }
  .word span { display: inline-block; }
  .word.shatter span { animation: shatter 0.65s ease-in forwards; }
  @keyframes shatter {
    to { transform: translate(var(--tx), var(--ty)) rotate(var(--rot)); opacity: 0; }
  }
  .trans { margin-top: 6px; font-size: var(--trans-size, 15px); font-weight: var(--trans-weight, 400); color: var(--trans-color, var(--sub-color)); line-height: 1.35;
           display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: var(--trans-lines, 2);
           overflow: hidden; white-space: normal; word-break: break-word; max-height: calc(var(--trans-lines, 2) * 1.4em); }
  .trans.hidden { font-style: italic; }
  .hint { font-size: 10px; color: var(--sub-color); display: var(--hint-display, block); }
  body.mini .card { padding: 4px 12px; }
  body.mini .trans, body.mini .hint { display: none; }
  body.mini .word { font-size: 20px; }
  body.mini .meta { font-size: 9px; margin-bottom: 1px; }
  body.mini #gear { display: none; }
  .bottomrow { margin-top: 5px; display: flex; justify-content: space-between; align-items: center; }
  .btnrow { display: var(--btnrow-display, flex); gap: 6px; }
  .btnrow button { font-size: 12px; padding: 2px 10px; border-radius: 6px; cursor: pointer; border: 1px solid #3a414b; background: #2b313a; color: #d7dce2; font-family: inherit; }
  .btnrow #btnKnow { color: var(--word-color); border-color: var(--border-color); }
  .btnrow #btnWrong { color: #ff8a8a; }
  .btnrow #btnMaster { color: #ffd166; }
  .bottomrow .hint { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  .btnrow button:hover { filter: brightness(1.3); }
  .word.wrongflash { color: #ff8a8a !important; text-shadow: 0 0 10px rgba(255, 110, 110, 0.75) !important; }
  .word.masterflash { color: #ffd166 !important; text-shadow: 0 0 12px rgba(255, 209, 102, 0.8) !important; }
  #grip { position: absolute; right: 2px; bottom: 2px; width: 15px; height: 15px; cursor: nwse-resize; z-index: 6; opacity: 0; transition: opacity 0.25s ease; }
  body.hovered #grip { opacity: 0.55; }
  #grip::before { content: ''; position: absolute; right: 3px; bottom: 3px; width: 8px; height: 8px; border-right: 2px solid var(--sub-color); border-bottom: 2px solid var(--sub-color); }
  .panel {
    position: absolute; inset: 6px; z-index: 10;
    background: rgba(20, 23, 27, 0.97); border: 1px solid #3a414b; border-radius: 8px;
    padding: 12px 14px; display: flex; flex-direction: column; justify-content: center; gap: 10px;
    font-size: 12px; color: #aeb7c2;
  }
  .panel.hidden2 { display: none; }
  .panel .row { display: flex; align-items: center; gap: 8px; }
  .panel .row span:first-child { width: 110px; flex: none; }
  .panel .sec { font-size: 10px; color: #566070; border-bottom: 1px solid #2b313a; padding-bottom: 2px; letter-spacing: 3px; }
  .panel .row.colorrow span, .panel .row.switchrow span { width: auto; flex: none; font-size: 11px; }
  .panel .row.colorrow { gap: 5px; }
  .panel .row.switchrow { gap: 5px; }
  .panel .row span { color: #aeb7c2; }
  .panel input[type=range] { flex: 1; accent-color: var(--word-color); }
  .panel b { width: 40px; text-align: right; font-weight: normal; color: #d7dce2; }
  .panel input[type=color] { width: 36px; height: 24px; border: none; background: none; padding: 0; cursor: pointer; }
  .panel input[type=checkbox] { width: 16px; height: 16px; accent-color: var(--word-color); cursor: pointer; }
  .panel select { flex: 1; min-width: 0; background: #2b313a; color: #d7dce2; border: 1px solid #3a414b; border-radius: 4px; padding: 2px 4px; font-size: 12px; }
  .panel .row select + span { width: auto; flex: none; margin-left: 4px; }
  .panel button { background: #2b313a; color: var(--word-color); border: 1px solid #3a414b;
                  border-radius: 6px; padding: 4px 14px; cursor: pointer; font-size: 12px; }
  .panel button:hover { border-color: var(--word-color); }
  .panel .btns { margin-left: auto; display: flex; gap: 8px; }
</style>
</head>
<body>
<div class="card" id="card">
  <div class="meta"><span id="book">…</span><span class="meta-r"><span id="counter"></span></span></div>
  <div class="word" id="word">…</div>
  <div class="trans hidden" id="trans">点击查看释义</div>
  <div class="bottomrow">
    <span class="hint" id="hint">右键/滚轮 切词 · Alt+2 认识 · Alt+1 不认识 · 右上角⚙ 设置</span>
    <span class="btnrow">
      <button id="btnWrong">✗ 不认识</button>
      <button id="btnKnow">✓ 认识</button>
      <button id="btnMaster">★ 熟记</button>
    </span>
  </div>
  <span id="gear" title="外观设置">⚙</span>
  <div id="grip" title="拖动调整大小"></div>

  <div class="panel hidden2" id="panel">
    <div class="sec">背景</div>
    <div class="row"><span>平时不透明度</span><input type="range" id="sIdle" min="0" max="100" step="1"><b id="vIdle"></b></div>
    <div class="row"><span>悬停不透明度</span><input type="range" id="sHover" min="0" max="100" step="1"><b id="vHover"></b></div>
    <div class="sec">文字与字体</div>
    <div class="row"><span>单词平时透明度</span><input type="range" id="sTextIdle" min="0" max="100" step="1"><b id="vTextIdle"></b></div>
    <div class="row"><span>单词悬停透明度</span><input type="range" id="sTextHover" min="0" max="100" step="1"><b id="vTextHover"></b></div>
    <div class="row"><span>单词字体/字重</span><select id="selFont"></select><select id="selWeight"></select><span style="width:auto">发光</span><input type="checkbox" id="cGlow"></div>
    <div class="row"><span>释义大小/字重</span><input type="range" id="sTransSize" min="10" max="26" step="1"><b id="vTransSize"></b><input type="range" id="sTransWeight" min="300" max="900" step="100"><b id="vTransWeight"></b></div>
    <div class="row"><span>释义行数</span><select id="selTransLines"><option value="1">1 行（单行省略）</option><option value="2">2 行</option><option value="3">3 行</option></select></div>
    <div class="sec">颜色</div>
    <div class="row colorrow"><span>单词</span><input type="color" id="cWord"><span>释义</span><input type="color" id="cTrans"><span>辅助</span><input type="color" id="cSub"><span>背景</span><input type="color" id="cBg"></div>
    <div class="sec">按键开关</div>
    <div class="row switchrow"><span>隐藏认识/不认识</span><input type="checkbox" id="cHideKnow"><span>隐藏按键说明</span><input type="checkbox" id="cHideHint"><span>滚轮切词</span><input type="checkbox" id="cWheel"></div>
    <div class="row"><span class="btns"><button id="reset">恢复默认</button><button id="done">完成</button></span></div>
  </div>
</div>
<script>
'use strict'
let cur = null        // getData 结果
let flipped = false
let press = null      // {sx, sy, moved, longTimer, longFired}
let animating = false
let panelOpen = false

const $ = (id) => document.getElementById(id)
const HINT_DEFAULT = '左键 翻释义 · 右键/滚轮 切词 · Alt+2 认识 / Alt+1 不认识 · 右上角⚙ 设置'
const cfgExtra = { idleOpacity: 0.15, hoverOpacity: 0.95, textIdleOpacity: 0, textHoverOpacity: 1, textGlow: true, wordColor: '#7ae6ac', subColor: '#aeb7c2', transColor: '#d7dce2', transSize: 15, transWeight: 400, transLines: 2, hideHint: false, hideKnowBtns: false, wheelSwitch: true, bgColor: '#1e2228', wordFont: 'Consolas', wordFontWeight: 800 }


function hexToRgba(hex, a) {
  let m = String(hex || '').replace('#', '')
  if (m.length === 3) m = m.split('').map((c) => c + c).join('')
  const n = parseInt(m, 16)
  if (isNaN(n)) return `rgba(30,34,40,${a})`
  return `rgba(${(n >> 16) & 255},${(n >> 8) & 255},${n & 255},${a})`
}
function applyColors() {
  const r = document.documentElement.style
  r.setProperty('--word-color', cfgExtra.wordColor)
  r.setProperty('--sub-color', cfgExtra.subColor)
  r.setProperty('--bg-color', hexToRgba(cfgExtra.bgColor, 0.88))
  r.setProperty('--border-color', hexToRgba(cfgExtra.wordColor, 0.3))
  r.setProperty('--card-o-idle', String(cfgExtra.idleOpacity))
  r.setProperty('--card-o-hover', String(cfgExtra.hoverOpacity))
  r.setProperty('--text-o-idle', String(cfgExtra.textIdleOpacity))
  r.setProperty('--text-o-hover', String(cfgExtra.textHoverOpacity))
  r.setProperty('--word-glow', cfgExtra.textGlow
    ? '0 0 12px color-mix(in srgb, var(--word-color) 55%, transparent), 0 0 2px color-mix(in srgb, var(--word-color) 85%, transparent)'
    : 'none')
  r.setProperty('--word-font', "'" + cfgExtra.wordFont + "'")
  r.setProperty('--word-weight', String(cfgExtra.wordFontWeight))
  r.setProperty('--trans-color', cfgExtra.transColor)
  r.setProperty('--trans-size', cfgExtra.transSize + 'px')
  r.setProperty('--trans-weight', String(cfgExtra.transWeight))
  r.setProperty('--trans-lines', String(Math.min(3, Math.max(1, Number(cfgExtra.transLines) || 2))))
  r.setProperty('--hint-display', cfgExtra.hideHint ? 'none' : 'block')
  r.setProperty('--btnrow-display', cfgExtra.hideKnowBtns ? 'none' : 'flex')
}
applyColors()

function renderWord(data) {
  cur = data
  if (!data || data.empty) {
    $('book').textContent = '摸鱼背词 Lite'
    $('counter').textContent = ''
    $('word').textContent = ''
    $('trans').textContent = data && data.message ? data.message : '暂无词书'
    $('trans').classList.remove('hidden')
    return
  }
  cfgExtra.idleOpacity = data.idleOpacity
  cfgExtra.hoverOpacity = data.hoverOpacity
  cfgExtra.textIdleOpacity = data.textIdleOpacity
  cfgExtra.textHoverOpacity = data.textHoverOpacity
  cfgExtra.textGlow = data.textGlow
  cfgExtra.wordColor = data.wordColor
  cfgExtra.subColor = data.subColor
  cfgExtra.transColor = data.transColor
  cfgExtra.transSize = data.transSize
  cfgExtra.transWeight = data.transWeight
  cfgExtra.transLines = data.transLines
  cfgExtra.hideHint = data.hideHint
  cfgExtra.hideKnowBtns = data.hideKnowBtns
  cfgExtra.wheelSwitch = data.wheelSwitch
  cfgExtra.bgColor = data.bgColor
  cfgExtra.wordFont = data.wordFont
  cfgExtra.wordFontWeight = data.wordFontWeight
  applyColors()
  renderState()
}

// 只刷新单词/计数（不触碰外观配置，防止切词时把面板里的新设置打回旧值）
function renderState() {
  if (!cur || cur.empty) return
  flipped = false
  const w = $('word')
  w.classList.remove('shatter')
  w.textContent = cur.word.name
  $('trans').textContent = '点击查看释义'
  $('trans').classList.add('hidden')
  $('book').textContent = cur.bookName
  $('counter').textContent = `${cur.idx + 1}/${cur.total} · ✓${cur.knownCount || 0} ✗${cur.wrongCount || 0}`
  const hint = $('hint')
  if (cur.knownCount === cur.total) hint.textContent = '本书已全部标记"已会"，可在托盘换书'
  else if (!hint.dataset.ct) hint.textContent = HINT_DEFAULT
}

async function refresh(force = false) {
  const data = await window.moyu.getData()
  if (!force && cur && !cur.empty && !data.empty &&
      cur.bookId === data.bookId && cur.idx === data.idx && cur.total === data.total && cur.knownCount === data.knownCount) {
    cur = data // 词书和进度都没变，不重绘（避免打断翻释义状态）
    return
  }
  renderWord(data)
}

async function next(dir) {
  if (animating || !cur || cur.empty) return
  const r = await window.moyu.next(dir)
  if (r && r.ok) {
    Object.assign(cur, { idx: r.idx, total: r.total, knownCount: r.knownCount, wrongCount: r.wrongCount, word: r.word })
    renderState()
  }
}

async function doMark(known) {
  if (!cur || cur.empty || animating) return
  animating = true
  try {
    const r = known ? await window.moyu.markKnown() : await window.moyu.markWrong()
    if (r && r.ok) { cur.knownCount = r.knownCount; cur.wrongCount = r.wrongCount }
    if (known) {
      // 碎裂动画 → 拼回原词 → 显示释义；停留在当前词，不自动跳转
      const w = $('word')
      const text = w.textContent
      w.textContent = ''
      for (const ch of text) {
        const s = document.createElement('span')
        s.textContent = ch
        s.style.setProperty('--tx', (Math.random() * 160 - 80).toFixed(0) + 'px')
        s.style.setProperty('--ty', (Math.random() * 120 - 20).toFixed(0) + 'px')
        s.style.setProperty('--rot', (Math.random() * 220 - 110).toFixed(0) + 'deg')
        w.appendChild(s)
      }
      w.classList.add('shatter')
      setTimeout(() => {
        w.classList.remove('shatter')
        w.textContent = text
        animating = false
        showMeaning()
        setupAuto(cur.autoAdvanceSeconds) // 重置自动切词计时，留出完整阅读时间
      }, 680)
    } else {
      const w = $('word')
      w.classList.add('wrongflash')
      setTimeout(() => {
        w.classList.remove('wrongflash')
        animating = false
        showMeaning()
        setupAuto(cur.autoAdvanceSeconds)
      }, 420)
    }
  } catch (err) {
    // IPC 异常也不能把界面冻死
    console.error('[float] doMark 失败:', err)
    animating = false
    showMeaning()
    setupAuto(cur.autoAdvanceSeconds)
  }
}

// 显示当前词的释义并停留在原地
function showMeaning() {
  if (!cur || cur.empty) return
  flipped = true
  const t = $('trans')
  t.textContent = (cur.word.trans || []).join('；')
  t.classList.remove('hidden')
}

// 熟记：该词进入全局熟记库，从所有词书中消失
async function doMaster() {
  if (!cur || cur.empty || animating) return
  animating = true
  try {
    const r = await window.moyu.markMaster()
    if (r && r.ok) { cur.knownCount = r.knownCount; cur.wrongCount = r.wrongCount; cur.masteredCount = r.masteredCount }
    const w = $('word')
    w.classList.add('masterflash')
    setTimeout(() => {
      w.classList.remove('masterflash')
      animating = false
      refresh(true) // 熟记的词已从列表移除，重新拉取显示下一个
    }, 500)
  } catch (err) {
    console.error('[float] doMaster 失败:', err)
    animating = false
    showMeaning()
    setupAuto(cur.autoAdvanceSeconds)
  }
}

// 鼠标交互：左键点击=翻释义，按住移动=拖窗口，长按3秒=已会，右键=切词
const card = $('card')
card.addEventListener('mousedown', (e) => {
  if (e.button !== 0 || animating || panelOpen) return
  press = { sx: e.screenX, sy: e.screenY, lastX: e.screenX, lastY: e.screenY, moved: false, longFired: false,
    longTimer: setTimeout(() => { press.longFired = true; doMark(true) }, 3000) }
})
window.addEventListener('mousemove', (e) => {
  if (resizing) {
    const dx = e.screenX - resizing.x, dy = e.screenY - resizing.y
    resizing.x = e.screenX; resizing.y = e.screenY
    window.moyu.growBy(dx, dy)
    return
  }
  if (!press) return
  const dx = e.screenX - press.lastX, dy = e.screenY - press.lastY
  if (!press.moved && Math.hypot(e.screenX - press.sx, e.screenY - press.sy) > 10) {
    press.moved = true
    clearTimeout(press.longTimer)
  }
  if (press.moved) {
    press.lastX = e.screenX; press.lastY = e.screenY
    window.moyu.moveBy(dx, dy)
  }
})
window.addEventListener('mouseup', (e) => {
  if (resizing) { resizing = null; return }
  if (!press) return
  clearTimeout(press.longTimer)
  const wasClick = !press.moved && !press.longFired
  const btn = e.button
  press = null
  if (wasClick && btn === 0 && cur && !cur.empty) {
    flipped = !flipped
    const t = $('trans')
    if (flipped) { t.textContent = (cur.word.trans || []).join('；'); t.classList.remove('hidden') }
    else { t.textContent = '点击查看释义'; t.classList.add('hidden') }
  }
})
card.addEventListener('contextmenu', (e) => { e.preventDefault(); if (!panelOpen) next(1) })
card.addEventListener('wheel', (e) => { e.preventDefault(); if (!panelOpen && cfgExtra.wheelSwitch) next(e.deltaY > 0 ? 1 : -1) }, { passive: false })

// 鼠标悬停：CSS 切换 背景双态 + 文字双态（相互独立，平滑过渡）；hover 事件同时服务"移出自动隐藏"
document.documentElement.addEventListener('mouseenter', () => { document.body.classList.add('hovered'); window.moyu.hover(true) })
document.documentElement.addEventListener('mouseleave', () => { document.body.classList.remove('hovered'); if (!panelOpen) window.moyu.hover(false) })

// ---- 外观设置面板 ----
const panel = $('panel')
function syncPanel() {
  $('sIdle').value = Math.round(cfgExtra.idleOpacity * 100)
  $('vIdle').textContent = Math.round(cfgExtra.idleOpacity * 100) + '%'
  $('sHover').value = Math.round(cfgExtra.hoverOpacity * 100)
  $('vHover').textContent = Math.round(cfgExtra.hoverOpacity * 100) + '%'
  $('sTextIdle').value = Math.round(cfgExtra.textIdleOpacity * 100)
  $('vTextIdle').textContent = Math.round(cfgExtra.textIdleOpacity * 100) + '%'
  $('sTextHover').value = Math.round(cfgExtra.textHoverOpacity * 100)
  $('vTextHover').textContent = Math.round(cfgExtra.textHoverOpacity * 100) + '%'
  $('cGlow').checked = !!cfgExtra.textGlow
  if (!$('selFont').options.length) {
    for (const f of ['Consolas', 'Cascadia Mono', 'Segoe UI', 'Arial', 'Verdana', 'Tahoma', 'Times New Roman', 'Courier New', 'Microsoft YaHei', 'SimHei', 'KaiTi', 'DengXian']) {
      const o = document.createElement('option'); o.value = f; o.textContent = f; $('selFont').appendChild(o)
    }
    for (const [v, t] of [[400, '400 常规'], [500, '500 中等'], [600, '600 半粗'], [700, '700 粗体'], [800, '800 特粗'], [900, '900 最黑']]) {
      const o = document.createElement('option'); o.value = v; o.textContent = t; $('selWeight').appendChild(o)
    }
  }
  $('selFont').value = cfgExtra.wordFont
  if (!$('selFont').value) { $('selFont').value = 'Consolas' }
  $('selWeight').value = String(cfgExtra.wordFontWeight)
  $('sTransSize').value = cfgExtra.transSize
  $('vTransSize').textContent = cfgExtra.transSize + 'px'
  $('sTransWeight').value = cfgExtra.transWeight
  $('vTransWeight').textContent = cfgExtra.transWeight
  $('selTransLines').value = String(Math.min(3, Math.max(1, Number(cfgExtra.transLines) || 2)))
  $('cHideHint').checked = !!cfgExtra.hideHint
  $('cHideKnow').checked = !!cfgExtra.hideKnowBtns
  $('cWheel').checked = !!cfgExtra.wheelSwitch
  $('cTrans').value = cfgExtra.transColor
  $('cWord').value = cfgExtra.wordColor
  $('cSub').value = cfgExtra.subColor
  $('cBg').value = cfgExtra.bgColor
}
function togglePanel(force) {
  panelOpen = force != null ? force : !panelOpen
  panel.classList.toggle('hidden2', !panelOpen)
  window.moyu.expand(panelOpen ? 500 : 150)
  if (panelOpen) syncPanel()
}
$('gear').addEventListener('mousedown', (e) => e.stopPropagation())
$('gear').addEventListener('mouseup', (e) => e.stopPropagation())
$('gear').addEventListener('click', (e) => { e.stopPropagation(); togglePanel() })
$('done').addEventListener('click', (e) => { e.stopPropagation(); togglePanel(false) })
const APPEARANCE_DEFAULTS = { idleOpacity: 0.15, hoverOpacity: 0.95, textIdleOpacity: 0, textHoverOpacity: 1, textGlow: true, wordColor: '#7ae6ac', subColor: '#aeb7c2', transColor: '#d7dce2', transSize: 15, transWeight: 400, transLines: 2, hideHint: false, hideKnowBtns: false, wheelSwitch: true, bgColor: '#1e2228', wordFont: 'Consolas', wordFontWeight: 800 }
$('reset').addEventListener('click', (e) => {
  e.stopPropagation()
  Object.assign(cfgExtra, APPEARANCE_DEFAULTS)
  applyColors()
  syncPanel()
  for (const k of Object.keys(APPEARANCE_DEFAULTS)) window.moyu.patchConfig(k, cfgExtra[k])
})
$('cGlow').addEventListener('change', (e) => { cfgExtra.textGlow = e.target.checked; applyColors(); window.moyu.patchConfig('textGlow', cfgExtra.textGlow) })
$('selFont').addEventListener('change', (e) => { cfgExtra.wordFont = e.target.value; applyColors(); window.moyu.patchConfig('wordFont', cfgExtra.wordFont) })
$('selWeight').addEventListener('change', (e) => { cfgExtra.wordFontWeight = Number(e.target.value); applyColors(); window.moyu.patchConfig('wordFontWeight', cfgExtra.wordFontWeight) })
$('sTransSize').addEventListener('input', (e) => { cfgExtra.transSize = Number(e.target.value); $('vTransSize').textContent = e.target.value + 'px'; applyColors(); window.moyu.patchConfig('transSize', cfgExtra.transSize) })
$('sTransWeight').addEventListener('input', (e) => { cfgExtra.transWeight = Number(e.target.value); $('vTransWeight').textContent = e.target.value; applyColors(); window.moyu.patchConfig('transWeight', cfgExtra.transWeight) })
$('selTransLines').addEventListener('change', (e) => { cfgExtra.transLines = Number(e.target.value); applyColors(); window.moyu.patchConfig('transLines', cfgExtra.transLines) })
$('cTrans').addEventListener('input', (e) => { cfgExtra.transColor = e.target.value; applyColors(); window.moyu.patchConfig('transColor', cfgExtra.transColor) })
$('cHideHint').addEventListener('change', (e) => { cfgExtra.hideHint = e.target.checked; applyColors(); window.moyu.patchConfig('hideHint', cfgExtra.hideHint) })
$('cHideKnow').addEventListener('change', (e) => { cfgExtra.hideKnowBtns = e.target.checked; applyColors(); window.moyu.patchConfig('hideKnowBtns', cfgExtra.hideKnowBtns) })
$('cWheel').addEventListener('change', (e) => { cfgExtra.wheelSwitch = e.target.checked; window.moyu.patchConfig('wheelSwitch', cfgExtra.wheelSwitch) })
panel.addEventListener('mousedown', (e) => e.stopPropagation())
panel.addEventListener('mouseup', (e) => e.stopPropagation())
panel.addEventListener('contextmenu', (e) => e.stopPropagation())
panel.addEventListener('wheel', (e) => e.stopPropagation(), { passive: true })
$('sIdle').addEventListener('input', (e) => {
  cfgExtra.idleOpacity = e.target.value / 100
  $('vIdle').textContent = e.target.value + '%'
  applyColors()
  window.moyu.patchConfig('idleOpacity', cfgExtra.idleOpacity)
})
$('sHover').addEventListener('input', (e) => {
  cfgExtra.hoverOpacity = e.target.value / 100
  $('vHover').textContent = e.target.value + '%'
  applyColors()
  window.moyu.patchConfig('opacity', cfgExtra.hoverOpacity)
})
$('sTextIdle').addEventListener('input', (e) => {
  cfgExtra.textIdleOpacity = e.target.value / 100
  $('vTextIdle').textContent = e.target.value + '%'
  applyColors()
  window.moyu.patchConfig('textIdleOpacity', cfgExtra.textIdleOpacity)
})
$('sTextHover').addEventListener('input', (e) => {
  cfgExtra.textHoverOpacity = e.target.value / 100
  $('vTextHover').textContent = e.target.value + '%'
  applyColors()
  window.moyu.patchConfig('textHoverOpacity', cfgExtra.textHoverOpacity)
})
$('cWord').addEventListener('input', (e) => { cfgExtra.wordColor = e.target.value; applyColors(); window.moyu.patchConfig('wordColor', e.target.value) })
$('cSub').addEventListener('input', (e) => { cfgExtra.subColor = e.target.value; applyColors(); window.moyu.patchConfig('subColor', e.target.value) })
$('cBg').addEventListener('input', (e) => { cfgExtra.bgColor = e.target.value; applyColors(); window.moyu.patchConfig('bgColor', e.target.value) })

// 拖动右下角手柄调整悬浮窗大小
let resizing = null
$('grip').addEventListener('mousedown', (e) => { e.stopPropagation(); resizing = { x: e.screenX, y: e.screenY } })
$('grip').addEventListener('mouseup', (e) => e.stopPropagation())

// 认识 / 不认识 / 熟记按钮（长按等效"认识"）
for (const id of ['btnKnow', 'btnWrong', 'btnMaster']) {
  $(id).addEventListener('mousedown', (e) => e.stopPropagation())
  $(id).addEventListener('mouseup', (e) => e.stopPropagation())
  $(id).addEventListener('contextmenu', (e) => e.stopPropagation())
}
$('btnKnow').addEventListener('click', (e) => { e.stopPropagation(); doMark(true) })
$('btnWrong').addEventListener('click', (e) => { e.stopPropagation(); doMark(false) })
$('btnMaster').addEventListener('click', (e) => { e.stopPropagation(); doMaster() })

// 主进程事件：迷你模式 / 鼠标穿透 / 托盘切词 / 热键调悬停透明度 / 全局认识与不认识
window.moyu.onEvent((name, data) => {
  if (name === 'mini') document.body.classList.toggle('mini', !!data)
  else if (name === 'clickthrough') {
    const h = $('hint')
    h.dataset.ct = data ? '1' : ''
    h.textContent = data ? '穿透中 · Alt+C 恢复鼠标' : HINT_DEFAULT
  } else if (name === 'do-next') next(1)
  else if (name === 'do-know') doMark(true)
  else if (name === 'do-wrong') doMark(false)
  else if (name === 'do-master') doMaster()
  else if (name === 'sync-book') refresh(true)
  else if (name === 'hover-opacity') { cfgExtra.hoverOpacity = data; applyColors() }
})

let autoTimer = null
function setupAuto(seconds) {
  if (autoTimer) { clearInterval(autoTimer); autoTimer = null }
  if (seconds > 0) autoTimer = setInterval(() => { if (!document.hidden) next(1) }, seconds * 1000)
}

refresh().then(() => { if (cur && !cur.empty) setupAuto(cur.autoAdvanceSeconds) })
// 兜底轮询：主窗口词库/章节变化由主进程推送，这里定期对账防止启动竞态漏掉首次同步
setInterval(() => refresh(), 5000)
</script>
